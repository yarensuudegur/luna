<title>Sema Uygulama Taslağı</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400&family=Space+Mono:wght@400;700&display=swap">
<style>
/* Layout: iPhone çerçevesi içinde tek sütun uygulama; beyaz zemin, siyah mürekkep; Void sekmesi siyah yıldızlı */
:root{
  --bg:#ffffff;
  --fg:#0b0b0b;
  --mute:#707070;
  --faint:#a6a6a6;
  --line:#e4e4e4;
  --soft:#f5f5f5;
  --serif:'Bodoni Moda','Bodoni 72','Didot',Georgia,'Times New Roman',serif;
  --mono:'Space Mono','Courier Prime',ui-monospace,Menlo,Consolas,monospace;
  --sans:-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',Helvetica,Arial,sans-serif;
  --navh:56px;
  --sbt:54px;
  --sbb:24px;
  color-scheme:light;
}
html{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:1px solid currentColor;outline-offset:3px}

/* cihaz */
.stage{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:28px 16px}
.device{position:relative;width:417px;height:876px;max-width:100%;border:12px solid #0b0b0b;border-radius:60px;background:var(--bg);overflow:hidden;transform:translateZ(0);box-shadow:0 30px 70px rgba(0,0,0,.16)}
.scr{position:absolute;left:0;right:0;bottom:0;top:var(--sbt);overflow-y:auto;overflow-x:hidden;scrollbar-width:none;z-index:2}
.scr::-webkit-scrollbar{display:none}
.sb{position:absolute;top:0;left:0;right:0;height:var(--sbt);z-index:50;background:var(--bg);color:var(--fg);display:flex;justify-content:space-between;align-items:center;padding:4px 32px 0 40px;font-family:var(--sans);font-weight:600;font-size:15px}
.sb .ic{display:flex;gap:6px;align-items:center}
.island{position:absolute;top:11px;left:50%;width:122px;height:35px;margin-left:-61px;border-radius:20px;background:#0b0b0b;z-index:51}
.homebar{position:absolute;bottom:8px;left:50%;width:136px;height:5px;margin-left:-68px;border-radius:3px;background:#0b0b0b;z-index:90;pointer-events:none}
.caption{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);text-align:center}
@media (max-width:500px),(max-height:700px) and (max-width:900px){
  :root{--sbt:0px;--sbb:0px}
  .stage{display:block;padding:0;height:100%}
  .device{width:100%;height:100%;border:0;border-radius:0;box-shadow:none}
  .sb,.island,.homebar,.caption{display:none}
}

.app{position:relative;min-height:100%;padding-bottom:calc(var(--navh) + var(--sbb) + 24px)}
.mono{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase}
.mono-s{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase}
.mute{color:var(--mute)}
.serif{font-family:var(--serif)}

.top{position:sticky;top:0;z-index:30;background:var(--bg);display:flex;justify-content:space-between;align-items:center;padding:12px 20px 12px;border-bottom:1px solid var(--line)}
.logo{font-family:var(--mono);font-size:11px;letter-spacing:.22em}
.top .r{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em}

.nav{position:absolute;bottom:0;left:0;right:0;z-index:30;background:var(--bg);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:var(--sbb)}
.nav button{height:var(--navh);font-family:var(--mono);font-size:8.5px;letter-spacing:.07em;color:var(--faint);position:relative;white-space:nowrap}
.nav button[aria-current="page"]{color:var(--fg)}
.nav button[aria-current="page"]::after{content:"";position:absolute;left:50%;bottom:12px;width:4px;height:4px;border-radius:50%;background:currentColor;transform:translateX(-50%)}

.sec{padding:28px 20px;border-bottom:1px solid var(--line)}
.lbl{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin:0 0 14px}
.h1{font-family:var(--serif);font-weight:400;font-size:34px;line-height:1.12;letter-spacing:-.01em;margin:0;text-wrap:balance}
.h2{font-family:var(--serif);font-weight:400;font-size:24px;line-height:1.2;margin:0;text-wrap:balance}
.h3{font-family:var(--serif);font-weight:400;font-size:19px;line-height:1.25;margin:0}
.body{font-size:14px;line-height:1.62;margin:0;max-width:62ch}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--fg);color:var(--bg);font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;padding:13px 18px}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--fg)}
.btn.small{padding:9px 12px;font-size:9.5px}
.link{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;text-decoration:underline;text-underline-offset:3px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.chip{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;border:1px solid var(--fg);padding:5px 8px;white-space:nowrap}
.stack{display:flex;flex-direction:column;gap:12px}

/* gün şeridi */
.days{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding:12px 14px 10px;border-bottom:1px solid var(--line)}
.days::-webkit-scrollbar{display:none}
.day{flex:0 0 46px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0 8px;color:var(--faint);position:relative}
.day .w{font-family:var(--mono);font-size:9px;letter-spacing:.12em}
.day .n{font-family:var(--serif);font-size:19px;line-height:1}
.day.today{color:var(--mute)}
.day[aria-pressed="true"]{color:var(--fg)}
.day[aria-pressed="true"]::after{content:"";position:absolute;bottom:0;left:12px;right:12px;height:1px;background:var(--fg)}

.glance{display:block}
.gav{width:112px;height:112px;margin:6px 0 22px auto;border-radius:50%;overflow:hidden;background:#ececec}
.gav img{width:100%;height:100%;object-fit:cover;mix-blend-mode:multiply;transform:scale(1.14) translateY(4%);display:block}
.datebtn{display:inline-flex;align-items:center;gap:8px;background:none;border:0;padding:0;line-height:1;color:inherit;font:inherit;letter-spacing:inherit;cursor:pointer}
.datebtn svg{transition:transform .25s}.datebtn[aria-expanded="true"] svg{transform:rotate(180deg)}
.moonball{width:64px;height:64px}
.dodont{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:24px}
.dodont h4{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin:0 0 8px;font-weight:400}
.dodont li{font-family:var(--serif);font-size:16px;line-height:1.5;list-style:none}
.dodont ul{margin:0;padding:0}
.eveRow{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;padding:14px 20px;background:var(--fg);color:var(--bg);text-align:left}

/* derine in */
.tabs{display:flex;gap:18px;border-bottom:1px solid var(--line);margin:0 -20px;padding:0 20px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);padding:10px 0 11px;white-space:nowrap;position:relative}
.tabs button[aria-selected="true"]{color:var(--fg)}
.tabs button[aria-selected="true"]::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:var(--fg)}
.deep .it{padding:16px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr auto;gap:4px 12px}
.deep .it:last-child{border-bottom:0}
.deep .k{font-family:var(--serif);font-size:17px}
.deep .s{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;align-self:center;display:flex;align-items:center;gap:6px}
.deep .t{grid-column:1/-1;color:var(--mute);font-size:13.5px}
.dot{width:7px;height:7px;border-radius:50%;border:1px solid var(--fg);display:inline-block}
.dot.f{background:var(--fg)}
.dot.h{background:linear-gradient(90deg,var(--fg) 50%,transparent 50%)}
.transit{display:grid;grid-template-columns:22px 1fr auto;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase}
.actions{display:flex;justify-content:space-between;align-items:center;padding-top:6px}
.saveb{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase}

/* arkadaş kartları */
.hscroll{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin:0 -20px;padding:2px 20px}
.hscroll::-webkit-scrollbar{display:none}
.fcard{flex:0 0 168px;border:1px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:10px;text-align:left}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--fg);color:var(--bg);display:grid;place-items:center;font-family:var(--serif);font-size:15px;flex:0 0 auto}
.avatar.l{width:72px;height:72px;font-size:30px}
.avatar.o{background:var(--bg);color:var(--fg);border:1px solid var(--fg)}
.banner{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:16px 20px;background:var(--fg);color:var(--bg);width:100%;text-align:left}
.banner .mono-s{opacity:.7}

/* son */
.theend{position:relative;height:calc(330px + var(--navh) + var(--sbb) + 24px);margin-bottom:calc(-1 * (var(--navh) + var(--sbb) + 24px));overflow:hidden;background:var(--bg)}
.theend svg.st{position:absolute;inset:0;width:100%;height:100%}
.theend svg.hillsvg{position:absolute;top:0;left:0;width:100%;height:330px}
.theend::after{content:"";position:absolute;left:0;right:0;top:328px;bottom:0;background:var(--fg)}
.mote{position:absolute;border-radius:50%;background:var(--fg);opacity:0;pointer-events:none;animation:rise var(--t) linear var(--d) infinite}
@keyframes rise{0%{opacity:0;transform:translate(0,0)}12%{opacity:var(--o)}75%{opacity:var(--o)}100%{opacity:0;transform:translate(var(--x),var(--y))}}
.luck .lk{display:flex;flex-direction:column;gap:8px;width:100%;text-align:left;padding:20px 0;border-bottom:1px solid var(--line)}
.luck .lk:last-child{border-bottom:0}
.luck .lkt{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-size:18px}
.luck .lkp{color:var(--mute);font-size:13.5px;line-height:1.6;max-width:60ch}
.theend .txt{position:absolute;left:0;right:0;top:196px;z-index:2;text-align:center;color:var(--bg);display:flex;flex-direction:column;align-items:center;gap:14px}
.theend .txt .serif{font-size:28px}

/* tarot */
.fan{position:relative;height:200px;margin:10px -20px 0;overflow:hidden}
.fan .c{position:absolute;left:50%;top:34px;width:62px;height:102px;margin-left:-31px;transform-origin:50% 230%;transition:transform .35s ease, opacity .3s}
.fan .c:hover,.fan .c:focus-visible{transform:var(--r) translateY(-14px)}
.back{width:100%;height:100%;background:var(--fg);border:1px solid var(--fg);border-radius:4px;position:relative;overflow:hidden}
.back::before{content:"";position:absolute;inset:4px;border:1px solid rgba(255,255,255,.55);border-radius:2px}
.back svg{position:absolute;inset:0;margin:auto;width:70%;height:70%}
.flipwrap{perspective:900px;width:170px;height:280px;margin:0 auto}
.flip{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.2,.7,.2,1)}
.flip.on{transform:rotateY(180deg)}
.flip>div{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.flip .front{transform:rotateY(180deg)}
.cardface{width:100%;height:100%;border:1px solid var(--fg);border-radius:5px;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:12px 8px;text-align:center}
.cardface.rev .art{transform:rotate(180deg)}
.cardface .art{width:86%;flex:1;display:grid;place-items:center}
.cardface .nm{font-family:var(--serif);font-size:15px;line-height:1.15}
.cardface .num{font-family:var(--mono);font-size:10px;letter-spacing:.14em}
.count{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);font-variant-numeric:tabular-nums}
.grid78{display:grid;grid-template-columns:repeat(13,1fr);gap:4px}
.grid78 i{aspect-ratio:2/3;border:1px solid var(--line);display:block;border-radius:2px}
.grid78 i.f{background:var(--fg);border-color:var(--fg)}

/* duygu */
.mood .m{display:grid;grid-template-columns:22px 92px 1fr 24px;gap:10px;align-items:center;padding:8px 0}
.mood .m label{font-family:var(--serif);font-size:16px}
.mood .v{font-family:var(--mono);font-size:12px;text-align:right;font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:22px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:1px;background:var(--fg)}
input[type=range]::-moz-range-track{height:1px;background:var(--fg)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--fg);margin-top:-7.5px;border:0}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--fg);border:0}
textarea,input[type=text],select{width:100%;font:inherit;font-size:14px;color:inherit;background:transparent;border:0;border-bottom:1px solid currentColor;padding:10px 0;border-radius:0;resize:none}
select{-webkit-appearance:none;appearance:none;border:0;padding:0;text-align:right;font-family:var(--mono);font-size:11px;letter-spacing:.06em;width:auto;max-width:60%;cursor:pointer}

/* şişe */
.orb{position:absolute;border-radius:50%;display:block}
.orb{background:var(--fg)}
.bsec{position:relative;height:520px;padding:28px 20px;border-bottom:1px solid var(--line);overflow:hidden}
.bsec .bt{position:absolute;left:20px;top:78px;z-index:2;font-family:var(--serif);font-weight:400;font-size:50px;line-height:1;letter-spacing:.01em;margin:0;text-transform:uppercase}
.bsec .bmeta{position:absolute;left:20px;bottom:26px;z-index:2;display:flex;flex-direction:column;gap:6px}
.bottlebtn{position:absolute;z-index:3;right:26px;top:110px;width:205px;height:360px}

.bottle.shake{animation:shake .95s ease-in-out}
@keyframes shake{0%,100%{transform:rotate(3deg)}12%{transform:rotate(-2deg)}26%{transform:rotate(8deg) scale(1.01)}40%{transform:rotate(-1deg) scale(1.02)}54%{transform:rotate(7deg) scale(1.02)}68%{transform:rotate(0deg) scale(1.03)}82%{transform:rotate(6deg) scale(1.03)}}
.drop{position:absolute;border-radius:50%;background:var(--fg);z-index:6;pointer-events:none}
.drop.foam{background:var(--bg);border:1px solid var(--fg)}
.popword{position:absolute;z-index:7;font-family:var(--serif);font-style:italic;font-size:38px;pointer-events:none;animation:popw 1.4s ease-out forwards}
@keyframes popw{0%{opacity:0;transform:scale(.3) rotate(-8deg)}18%{opacity:1;transform:scale(1.15) rotate(-4deg)}100%{opacity:0;transform:translateY(-40px) scale(1) rotate(-2deg)}}
.story{border:1px solid var(--fg);aspect-ratio:9/16;width:100%;max-width:230px;margin:0 auto;padding:16px 14px;display:flex;flex-direction:column;justify-content:space-between;align-items:center;text-align:center;overflow:hidden;background:var(--bg)}
.story.big{max-width:290px}
.story .sbottle{position:relative;height:190px;width:100%}
.story.big .sbottle{height:250px}
.story .sbottle .bottle{position:absolute;left:50%;top:50%;margin:-180px 0 0 -102px}
.story .bottle{transform:rotate(3deg) scale(.52)}
.story.big .bottle{transform:rotate(3deg) scale(.68)}
.story .sline{font-size:19px;line-height:1.2}
.story.big .sline{font-size:23px}
.savg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px 6px;width:100%;font-family:var(--mono);font-size:8px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.savg b{display:block;font-family:var(--serif);font-size:17px;font-weight:400;letter-spacing:0;color:var(--fg)}
.bottle.free .orbs{-webkit-mask-image:none;mask-image:none}
.bottle img{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;user-select:none}
.bottle .orb{width:17px;height:17px;animation:bob var(--t,6s) ease-in-out var(--d,0s) infinite;transition:top 1s cubic-bezier(.35,.6,.35,1),left 1s cubic-bezier(.35,.6,.35,1),opacity .8s}
@keyframes bob{0%,100%{transform:translate(0,0)}33%{transform:translate(var(--dx),var(--dy))}66%{transform:translate(calc(var(--dx)*-.6),calc(var(--dy)*.5))}}
.bottle img.cork{inset:auto;left:153.8px;top:6.2px;width:40px;height:46px;transform:translate(-10px,28px);transform-origin:50% 60%;transition:transform 1s cubic-bezier(.25,.8,.35,1),opacity .6s}
.bottle .corkclip{position:absolute;inset:0;pointer-events:none;-webkit-clip-path:polygon(-300px -600px,520px -600px,520px 81px,-300px 29px);clip-path:polygon(-300px -600px,520px -600px,520px 81px,-300px 29px)}
.bottle.open img.cork{transform:translate(0,0) rotate(0deg)}
.bottle img.cork.gone{transform:translate(110px,-230px) rotate(260deg);opacity:0;transition:transform 1.1s cubic-bezier(.15,.7,.3,1),opacity 1.1s ease-in}
.spark{display:grid;grid-template-columns:18px 86px 1fr 32px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.spark .orb{position:static;width:9px;height:9px}
.spark .k{font-family:var(--serif);font-size:15px}
.spark svg{width:100%;height:28px;display:block;overflow:visible}
.spark .v{font-family:var(--mono);font-size:11px;text-align:right;font-variant-numeric:tabular-nums}

/* listeler */
.list .li{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.list .li:last-child{border-bottom:0}
.grow{flex:1;min-width:0}
.name{font-family:var(--serif);font-size:18px;line-height:1.2}
.signs{font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--mute);margin-top:3px}
.arrow{font-family:var(--mono);font-size:12px}
.bar{display:flex;gap:3px}
.bar i{width:9px;height:9px;border:1px solid var(--fg);display:block}
.bar i.f{background:var(--fg)}
.room{border:1px solid var(--line);padding:16px;display:flex;flex-direction:column;gap:8px;text-align:left;width:100%}
.room.dark{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.room.dark .mute{color:#bdbdbd}
.msgs{display:flex;flex-direction:column;gap:14px;padding:20px 20px 150px}
.msg{display:grid;grid-template-columns:30px 1fr;gap:10px}
.msg .avatar{width:30px;height:30px;font-size:13px}
.msg .meta{font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);display:flex;gap:10px}
.msg .txt{font-size:14.5px;line-height:1.5;margin-top:2px}
.msg.me .avatar{background:var(--bg);color:var(--fg);border:1px solid var(--fg)}
.composer{position:absolute;left:0;right:0;bottom:calc(var(--navh) + var(--sbb));background:var(--bg);border-top:1px solid var(--line);padding:10px 20px 12px;z-index:25}
.composer form{display:flex;gap:10px;align-items:flex-end}
.composer textarea{padding:8px 0;font-size:15px;min-height:38px;max-height:120px}

/* harita */
.wheel{width:100%;max-width:330px;margin:0 auto;display:block}
.ptable{display:grid;grid-template-columns:1fr 1.2fr 40px;border-top:1px solid var(--line)}

function tarotArt(i,size){
  const s=size||90,c=s/2,m=i%6,n=6+(i%5)*2;let g='';const st='stroke="#0b0b0b" fill="none" stroke-width="1"';
  if(m===0){g+=`<circle cx="${c}" cy="${c}" r="${s*.16}" ${st}/>`;for(let k=0;k<n;k++){const a=k/n*Math.PI*2;g+=`<line x1="${c+Math.cos(a)*s*.22}" y1="${c+Math.sin(a)*s*.22}" x2="${c+Math.cos(a)*s*.4}" y2="${c+Math.sin(a)*s*.4}" stroke="#0b0b0b"/>`}}
  else if(m===1){g+=`<path d="M ${c+s*.08} ${c-s*.3} A ${s*.3} ${s*.3} 0 1 0 ${c+s*.08} ${c+s*.3} A ${s*.22} ${s*.3} 0 1 1 ${c+s*.08} ${c-s*.3} Z" ${st}/>`;for(let k=0;k<3;k++)g+=`<circle cx="${c+s*(.22+k*.06)}" cy="${c-s*(.2-k*.18)}" r="1.4" fill="#0b0b0b"/>`}
  else if(m===2){let p='';const pts=n/2+3;for(let k=0;k<pts*2;k++){const a=k/(pts*2)*Math.PI*2-Math.PI/2,r=k%2?s*.14:s*.38;p+=(k?'L':'M')+(c+Math.cos(a)*r).toFixed(1)+' '+(c+Math.sin(a)*r).toFixed(1)}g+=`<path d="${p}Z" ${st}/>`}
  else if(m===3){for(let k=1;k<=4;k++)g+=`<circle cx="${c}" cy="${c}" r="${s*.09*k}" ${st}/>`;g+=`<circle cx="${c}" cy="${c}" r="2" fill="#0b0b0b"/>`}
  else if(m===4){g+=`<path d="M ${c} ${c-s*.38} L ${c+s*.3} ${c+s*.3} L ${c-s*.3} ${c+s*.3} Z" ${st}/>`;for(let k=1;k<4;k++)g+=`<line x1="${c-s*.3*k/4}" y1="${c-s*.38+s*.68*k/4}" x2="${c+s*.3*k/4}" y2="${c-s*.38+s*.68*k/4}" stroke="#0b0b0b"/>`}
  else{g+=`<circle cx="${c}" cy="${c}" r="${s*.36}" ${st}/>`;for(let k=0;k<n;k++){const a=k/n*Math.PI;g+=`<line x1="${c-Math.cos(a)*s*.36}" y1="${c-Math.sin(a)*s*.36}" x2="${c+Math.cos(a)*s*.36}" y2="${c+Math.sin(a)*s*.36}" stroke="#0b0b0b" stroke-width=".7"/>`}}
  return `<svg viewBox="0 0 ${s} ${s}" width="100%" height="100%" aria-hidden="true">${g}</svg>`;
}

function reading(key){
  const d=fromKey(key),r=rng('day'+key),item=DAILY[Math.floor(r()*DAILY.length)],ay=BURC_DA[moonSign(d)];
  let body=item.b.replace('{ay}',ay);const t=S.settings.tone;
  if(t==='Destekleyici')body+=' '+item.s;else if(t==='Sert')body+=' '+item.x;
  const r2=rng('dd'+key);const dos=pickN(r2,DO,3),donts=pickN(r2,DONT,3);
  const deep=Object.keys(DEEP).map(k=>{const st=Math.floor(rng('deep'+k+key)()*4);let txt=DEEP[k][st];if(k==='Aşk'&&['İlişkide','Evli'].includes(S.settings.status))txt=DEEP_PARTNER[st];return{k,st,txt}});
  let z=0;deep.forEach(x=>{if(x.st===2){z++;if(z>1){x.st=3;x.txt=DEEP[x.k][3]}}});
  return{h:item.h,body,dos,donts,deep,moon:moonSign(d),phase:phaseName(d)};
}
function friendDay(f,key){
  const r=rng('f'+f.id+key+f.rel);
  const harmony=(f.sun%4===ME.sun%4)?1.5:((f.sun%4+ME.sun%4)===2||(f.sun%4+ME.sun%4)===4)?.8:0;
  const score=Math.min(10,Math.round(3+r()*6+harmony)),fi=score>=7?0:score>=4?1:2;
  let pool=TAGS_ALL.slice();if(ROMANTIC.includes(f.rel))pool=pool.concat(TAGS_ROM);
  const tags=pickN(r,pool,2);const cats=REL_CATS[f.rel].map(c=>({c,v:Math.max(1,Math.min(10,Math.round(score+(r()*4-2))))}));
  return{score,tags,blurb:REL_BLURB[f.rel][fi],cats};
}

  const days=[];for(let i=-7;i<=7;i++){const dd=addDays(now(),i),k=keyOf(dd);days.push(`<button class="day ${k===TODAY?'today':''}" data-day="${k}" aria-pressed="${k===key}"><span class="w">${k===TODAY?'BGN':GUNK[dd.getDay()]}</span><span class="n">${dd.getDate()}</span></button>`)}
  const ev=nextEvent(now()),evDays=ev?Math.max(0,Math.round((ev.date-now())/86400000)):0;
  const out=[];
  if(S.daysOpen)out.push(`<div class="days" role="group" aria-label="Günler">${days.join('')}</div>`);
  if(isToday&&isEvening()&&!(S.moods[TODAY]&&!S.moods[TODAY].ex))out.push(`<button class="eveRow" data-go="gunluk"><span><span class="mono-s" style="opacity:.7">SAAT ${esc(S.settings.evening)}</span><br><span class="serif" style="font-size:18px">Bugünü şişene ekle.</span></span><span class="arrow">→</span></button>`);
  out.push(`<section class="sec">
    <div class="gav"><img src="${avSrc()}" alt="Profil fotoğrafı"></div><div class="glance"><div><p class="lbl">${isToday?'GÜNÜN ÖZETİ':up(GUN[d.getDay()])+' '+up(fmt(d))}</p><h1 class="h1">${esc(R.h)}</h1></div></div>
    <p class="body" style="margin-top:18px">${esc(R.body)}</p>
    <div class="dodont"><div><h4>Yap</h4><ul>${R.dos.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><div><h4>Yapma</h4><ul>${R.donts.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div></div>
    <div style="margin-top:26px"><button class="btn" id="diveBtn">Derine in ›</button></div>
  </section>`);
  out.push(luckSection(R));
  out.push(`<section class="sec">
    <div class="row"><p class="lbl" style="margin:0">ARKADAŞLARINLA</p><button class="link" data-go="arkadas">Tümü</button></div>
    <div class="hscroll" style="margin-top:14px">${S.friends.map(f=>{const x=friendDay(f,key);return`<button class="fcard" data-friend="${f.id}">
      <span class="avatar">${esc(f.name[0])}</span>
      <div><div class="name" style="font-size:16px">${esc(f.name)}</div><div class="signs">${esc(up(f.rel))}</div></div>
      <div class="mono-s">${esc(x.tags[0])}</div>
      <div style="font-size:12.5px;color:var(--mute)">${esc(x.blurb)}</div></button>`}).join('')}</div>
  </section>`);
  if(ev)out.push(`<button class="banner" data-room-go>
    <span>${moonSVG(ev.date,34,true)}</span>
    <span><span class="mono-s">${evDays} GÜN SONRA</span><br><span class="serif" style="font-size:19px">${ev.name} ${BURC_DA[ev.sign]}</span><br><span style="font-size:12.5px;opacity:.75">${fmt(ev.date)}. O gün olay odası açılır.</span></span>
    <span class="arrow">→</span></button>`);
  if(isToday)out.push(tarotSection());
  out.push(theEnd(key));
  const f=frag(out);
  f.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{S.sel=b.dataset.day;save();render()});
  f.querySelectorAll('[data-friend]').forEach(b=>b.onclick=()=>openFriend(b.dataset.friend));
  f.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));
  f.querySelectorAll('[data-room-go]').forEach(b=>b.onclick=()=>{S.fsub='odalar';go('arkadas')});
  $('#diveBtn',f).onclick=()=>{UI.deep=true;render();SCR.scrollTop=0};
  f.querySelectorAll('[data-lucktab]').forEach(b=>b.onclick=()=>{S.luckTab=b.dataset.lucktab;save();f.querySelectorAll('[data-lucktab]').forEach(x=>x.setAttribute('aria-selected',x===b));const it=$('#lk_'+LUCK_ORDER.indexOf(b.dataset.lucktab),f);if(it)SCR.scrollTo({top:it.getBoundingClientRect().top-SCR.getBoundingClientRect().top+SCR.scrollTop-100,behavior:'smooth'})});
  f.querySelectorAll('[data-luckgo]').forEach(b=>b.onclick=()=>{S.deepTab=b.dataset.luckgo;save();UI.deep=true;render();SCR.scrollTop=0});
  $('#futureBtn',f).onclick=futureFlow;
  bindTarot(f);
  return f;
}
function vDeep(){
  const key=S.sel,d=fromKey(key),R=reading(key),sys=S.settings.house;
  const ml=moonLon(d),sl=sunLon(d),mh=houseOf(ml,sys),sh=houseOf(sl,sys);
  const extra=`Ay bugün haritanın ${mh}. evinden geçiyor, bu yüzden ${HOUSE_THEME[mh-1]} daha çok gündeminde olabilir. Güneş ise ${sh}. evinde ve ${HOUSE_THEME[sh-1]} alanını aydınlatıyor.`;
  const t=S.tarot[key];
  const cats=['Tümü','Aşk','Arkadaşlar','İş & para','Ev & aile'];
  const list=R.deep.filter(x=>S.deepTab==='Tümü'||x.k===S.deepTab);
  const ic=st=>st===0?'<i class="dot f"></i>':st===1?'<i class="dot h"></i>':st===2?'<i class="dot"></i>':'<i class="dot" style="border-style:dashed"></i>';
  const saved=S.saved.some(x=>x.key===key);
  const f=frag([
    `<section class="sec" style="padding-top:16px;padding-bottom:16px"><button class="link" id="backB">← Bugün</button></section>`,
    `<section class="sec">
      <p class="lbl">DERİNE İN · ${up(fmt(d))}</p>
      <h1 class="h1">${esc(R.h)}</h1>
      <p class="body" style="margin-top:18px">${esc(R.body)}</p>
      <p class="body" style="margin-top:12px">${esc(extra)}</p>
      ${t?`<p class="body" style="margin-top:12px">Günün kartı ${esc(TAROT[t.i][1])}${t.rev?', ters':''}. ${esc(TAROT[t.i][4])}</p>`:''}
    </section>`,
    `<section class="sec"><p class="lbl">GÖKYÜZÜNDE BUGÜN</p>
      <div class="transit"><span>☽︎</span><span>Ay · ${up(BURC[Math.floor(ml/30)])} ${Math.floor(ml%30)}°</span><span>${mh}. EV</span></div>
      <div class="transit"><span>☉︎</span><span>Güneş · ${up(BURC[Math.floor(sl/30)])} ${Math.floor(sl%30)}°</span><span>${sh}. EV</span></div>
      <div class="transit" style="border-bottom:0"><span>◐</span><span>${up(R.phase)}</span><span></span></div>
    </section>`,
    `<section class="sec">
      <div class="tabs" role="tablist">${cats.map(c=>`<button role="tab" data-deep="${c}" aria-selected="${S.deepTab===c}">${c}</button>`).join('')}</div>
      <div class="deep">${list.map(x=>`<div class="it"><span class="k">${esc(x.k)}</span><span class="s">${ic(x.st)}${STATES[x.st]}</span><span class="t">${esc(x.txt)}</span></div>`).join('')}</div>
    </section>`,
    `<section class="sec" style="border-bottom:0"><div class="actions"><button class="saveb" id="saveB">${bookmark(saved)} ${saved?'Kaydedildi':'Kaydet'}</button><button class="saveb" id="shareB">Paylaş ↗</button></div></section>`
  ]);
  $('#backB',f).onclick=()=>{UI.deep=false;render();SCR.scrollTop=0};
  f.querySelectorAll('[data-deep]').forEach(b=>b.onclick=()=>{S.deepTab=b.dataset.deep;save();const st=SCR.scrollTop;render();SCR.scrollTop=st});
  $('#saveB',f).onclick=()=>{const i=S.saved.findIndex(x=>x.key===key);if(i>=0){S.saved.splice(i,1);toast('Kayıttan çıkarıldı')}else{S.saved.unshift({key,h:R.h});toast('Günlük’e kaydedildi')}save();const st=SCR.scrollTop;render();SCR.scrollTop=st};
  $('#shareB',f).onclick=()=>copy(`${R.h}\n\n${R.body}\n\nYap: ${R.dos.join(', ')}\nYapma: ${R.donts.join(', ')}\n\nSema · ${fmt(d)}`);
  return f;
}
function futureFlow(){
  let span='1 ay';
  const s=sheet(`<div class="row"><p class="lbl" style="margin:0">GELECEKTEKİ SANA</p><button class="x" data-close aria-label="Kapat">✕</button></div>
    <h2 class="h2" style="margin-top:14px">Bugünden bir not bırak.</h2>
    <textarea id="futTxt" rows="4" placeholder="Sevgili gelecekteki ben..." style="margin-top:14px"></textarea>
    <div class="row" style="margin-top:18px"><span class="mono-s mute">NE ZAMAN GELSİN</span><span class="seg" id="futSeg">${['1 ay','6 ay','1 yıl'].map(o=>`<button data-v="${o}" aria-pressed="${o===span}">${o}</button>`).join('')}</span></div>
    <div style="margin-top:22px"><button class="btn" id="futOk">Mühürle</button></div>`);
  s.el.querySelectorAll('#futSeg button').forEach(b=>b.onclick=()=>{span=b.dataset.v;s.el.querySelectorAll('#futSeg button').forEach(x=>x.setAttribute('aria-pressed',x===b))});
  $('#futOk',s.el).onclick=()=>{const t=$('#futTxt',s.el).value.trim();if(!t){toast('Önce bir şey yaz');return}
    const n={'1 ay':30,'6 ay':182,'1 yıl':365}[span];const at=keyOf(addDays(now(),n));S.future.push({t:t.slice(0,800),at,from:TODAY});save();s.close();toast(fmt(fromKey(at))+' günü gelecek');render()};
}

/* KART */
function msToMidnight(){const n=now(),m=new Date(n);m.setHours(24,0,0,0);return m-n}
function countdown(){const ms=msToMidnight();return `${pad2(Math.floor(ms/3600000))}:${pad2(Math.floor(ms%3600000/60000))}:${pad2(Math.floor(ms%60000/1000))}`}
function cardFace(i,rev){const t=TAROT[i];return `<div class="cardface ${rev?'rev':''}"><span class="num">${t[0]}</span><span class="art">${tarotArt(i,90)}</span><span class="nm">${esc(t[1])}${rev?'<br><span class="mono-s">TERS</span>':''}</span></div>`}
function tarotSection(){
  const t=S.tarot[TODAY];
  if(!t){
    const n=22,cards=[];for(let i=0;i<n;i++){const a=-28+i*(56/(n-1));cards.push(`<button class="c" style="--r:rotate(${a}deg);transform:rotate(${a}deg)" data-card="${i}" aria-label="${i+1}. kart"><div class="back">${BACK_SVG}</div></button>`)}
    return `<section class="sec" id="tarotSec" style="text-align:center"><p class="lbl">GÜNÜN KARTI</p><h2 class="h1" style="font-size:30px">Desteden bir kart seç.</h2><div class="fan" id="fan">${cards.join('')}</div></section>`;
  }
  const c=TAROT[t.i];
  return `<section class="sec" id="tarotSec" style="text-align:center">
    <div class="row"><p class="lbl" style="margin:0">GÜNÜN KARTI</p><span class="count" data-cd>YENİ KART ${countdown()}</span></div>
    <div class="flipwrap" style="margin-top:18px"><div class="flip on" id="flip"><div><div class="back" style="border-radius:5px">${BACK_SVG}</div></div><div class="front">${cardFace(t.i,t.rev)}</div></div></div>
    <div class="stack" style="margin-top:20px">
      <h2 class="h1" style="font-size:30px">${esc(c[1])}${t.rev?', ters':''}.</h2>
      <p class="body" style="margin:0 auto">Bugün bu enerji olabilir: ${esc(low(t.rev?c[3]:c[2]))}</p>
      <p class="body mute" style="margin:0 auto">${esc(c[4])}</p>
      <div><button class="btn" id="askCard">Void’e sor</button></div>
    </div></section>`;
}
function bindTarot(root){
  root.querySelectorAll('[data-card]').forEach(b=>b.onclick=()=>{
    if(S.tarot[TODAY])return;
    const i=Math.floor(Math.random()*22),rev=Math.random()<.22;
    root.querySelectorAll('.fan .c').forEach(c=>{if(c!==b)c.style.opacity='0'});
    b.style.transform='rotate(0) translateY(-30px) scale(1.15)';
    setTimeout(()=>{S.tarot[TODAY]={i,rev};save();const st=SCR.scrollTop;render();SCR.scrollTop=st;const fl=$('#flip');if(fl){fl.classList.remove('on');requestAnimationFrame(()=>requestAnimationFrame(()=>fl.classList.add('on')))}},380);
  });
  const a=$('#askCard',root);if(a)a.onclick=()=>{const t=S.tarot[TODAY],c=TAROT[t.i];S.pendingQ=`Bugün ${c[1]}${t.rev?' (ters)':''} kartını çektim. Haritamla birlikte bugün benim için ne anlama geliyor?`;go('void')};
}
setInterval(()=>{const e=document.querySelector('[data-cd]');if(e)e.textContent='YENİ KART '+countdown()},1000);

/* ARKADAŞLAR */
function signsLine(p){return `☉︎ ${BURC[p.sun]}  ☽︎ ${BURC[p.moon]}  ↑ ${BURC[p.asc]}`}
function vArkadas(){
  const sub=S.fsub||'kisiler',out=[];
  out.push(`<div class="tabs" role="tablist" style="margin:0;padding:0 20px">${[['kisiler','Kişiler'],['odalar','Sohbet & odalar'],['grup','Grup haritası']].map(([k,l])=>`<button role="tab" data-sub="${k}" aria-selected="${sub===k}">${l}</button>`).join('')}</div>`);
  if(sub==='kisiler'){
    out.push(`<section class="sec" style="display:grid;grid-template-columns:1fr auto;gap:16px;align-items:end">
      <div><p class="lbl">YAKININDAKİLER</p><h2 class="h2">Haritalarınızı yan yana koyun.</h2></div>
      <button class="btn" id="addF" aria-label="Arkadaş ekle">Ekle +</button></section>`);

  }

      <p class="lbl" style="margin:0">KOZMİK OLAY ODASI</p>
      ${ev?`<button class="room dark" data-room="olay" ${open?'':'aria-disabled="true"'}>
        <span class="row"><span class="mono-s">${open?'AÇIK':Math.round((ev.date-now())/86400000)+' GÜN SONRA AÇILIR'}</span>${moonSVG(ev.date,26,true)}</span>
        <span class="serif" style="font-size:22px">${ev.name} odası</span>
        <span class="mute" style="font-size:12.5px">${fmt(ev.date)} · Ay ${BURC_DA[ev.sign]}. Olay boyunca açık kalır.</span>
        ${open?'':`<span class="link" id="remind">${S.remind?'Hatırlatma kuruldu ✓':'Açılınca haber ver'}</span>`}</button>`:''}
      <div class="row" style="margin-top:12px"><p class="lbl" style="margin:0">GRUPLAR</p><button class="mono-s" id="newGroup">YENİ GRUP +</button></div>
      ${groups().map(g=>`<button class="room" data-room="${g.id}"><span class="mono-s mute">GRUP · ${g.members.length+1} KİŞİ</span><span class="serif" style="font-size:20px">${esc(g.name)}</span><span class="mute" style="font-size:12.5px">${esc(lastMsg(g.id)||'Henüz mesaj yok')}</span></button>`).join('')||'<p class="body mute">Henüz grubun yok.</p>'}
    </section>`);
  }
  if(sub==='grup'){
    const people=[{name:'Sen',sun:ME.sun},...S.friends],cnt=[0,0,0,0];people.forEach(p=>cnt[p.sun%4]++);
    const tot=people.length,dom=cnt.indexOf(Math.max(...cnt));
    out.push(`<section class="sec"><p class="lbl">GRUP HARİTASI · ${tot} KİŞİ</p><h2 class="h2">Grubunuz %${Math.round(cnt[dom]/tot*100)} ${low(ELEM[dom])}.</h2>
      <div style="margin-top:20px" class="stack">${ELEM.map((e,i)=>`<div class="row"><span class="mono" style="width:70px">${e}</span><span class="bar" style="flex:1">${Array.from({length:tot},(_,j)=>`<i class="${j<cnt[i]?'f':''}"></i>`).join('')}</span><span class="mono">${cnt[i]}</span></div>`).join('')}</div></section>`);
    out.push(`<section class="sec"><p class="lbl">ROLLER</p><div class="list">${people.map(p=>{const e=p.sun%4;return `<div class="li"><span class="avatar ${p.name==='Sen'?'o':''}">${esc(p.name[0])}</span><span class="grow name" style="font-size:16px">${esc(p.name)}</span><span class="mono-s">${['Ateşleyici','Planlayıcı','Fikir insanı','Arabulucu'][e]} · ${ELEM[e]}</span></div>`}).join('')}</div>
      <div style="margin-top:16px"><button class="btn" id="shareGroup">Grup kartını paylaş</button></div></section>`);
  }
  const f=frag(out);
  f.querySelectorAll('[data-sub]').forEach(b=>b.onclick=()=>{S.fsub=b.dataset.sub;save();render()});
  f.querySelectorAll('[data-friend]').forEach(b=>b.onclick=()=>openFriend(b.dataset.friend));
  f.querySelectorAll('[data-room]').forEach(b=>b.onclick=e=>{if(e.target.id==='remind'){S.remind=!S.remind;save();toast(S.remind?'Oda açılınca haber vereceğiz':'Hatırlatma kapatıldı');render();return}
    if(b.getAttribute('aria-disabled')==='true'){toast('Oda olay günü açılır');return}openRoom(b.dataset.room)});
  const a=$('#addF',f);if(a)a.onclick=addFriendFlow;
  const ng=$('#newGroup',f);if(ng)ng.onclick=()=>groupEditor(null);
  const sg=$('#shareGroup',f);if(sg)sg.onclick=()=>copy('Grubumuzun haritası Luna’da: luna.app/g/ev');
  return f;
}
function addFriendFlow(){

  const panel=$('.panel',s.el);
  const bumpView=()=>{panel.innerHTML=`<div class="row"><p class="lbl" style="margin:0">ARKADAŞ EKLE</p><button class="x" data-x aria-label="Kapat">✕</button></div>
    <div style="flex:1;display:flex;flex-direction:column;justify-content:center;gap:10px;text-align:center">

      <div style="display:flex;justify-content:center;align-items:center;gap:8px;margin-top:6px" id="bumpS"><span class="pulse"></span><span class="mono-s mute">Yakındaki telefon aranıyor</span></div>
    </div>

    clearTimeout(timer);timer=setTimeout(()=>{
      if(!S.friends.find(f=>f.name==='Ece')){S.friends.push({id:'ece',name:'Ece',handle:'@ece.d',sun:8,moon:2,asc:4,rel:'Arkadaş',hist:[]});save()}
      const a=$('#bumpAnim',panel);if(!a)return;a.innerHTML='<div class="avatar l">E</div>';$('#bumpT',panel).textContent='Ece ile eşleştin.';$('#bumpS',panel).innerHTML='<span class="mono-s mute">YAY · İKİZLER · ASLAN</span>';
      timer=setTimeout(()=>{s.close();S.fsub='kisiler';render()},1600);
    },4200);

  const qrView=()=>{
    const r=rng('qr-deniz');let cells='';

  };
  bumpView();
}

function transitionCard(f,from,to){
  const a=ME.sun%4,b=f.sun%4;
  const pair=a===b?'Güneşleriniz aynı elementte, aynı dili konuşuyorsunuz.':((a+b)===2||(a+b)===4)?'Güneşleriniz birbirini besleyen elementlerde.':'Güneşleriniz farklı hızlarda, bu da ilişkiye merak katıyor.';
  const w=document.createElement('div');
  w.innerHTML=`<div class="sheet full" role="dialog" aria-modal="true"><div class="panel">
    <div class="row"><span class="mono-s">SEMA · ${up(fmt(now()))}</span><button class="x" data-x aria-label="Kapat">✕</button></div>
    <div><p class="mono-s" style="opacity:.7">${esc(up(from))} → ${esc(up(to))}</p><h1 class="h1" style="font-size:44px;margin-top:10px">${from==='Arkadaş'?'Arkadaştan':esc(from)+'’ten'} ${to==='Flört'?'flörte.':'sevgiliye.'}</h1>
    <p style="font-size:15px;opacity:.85;margin-top:16px;max-width:34ch">${pair} ${esc(BURC[ME.sun])} ve ${esc(BURC[f.sun])}.</p></div>
    <div class="row"><span class="mono-s" style="opacity:.7">SEN & ${esc(up(f.name))}</span><button class="btn ghost" style="color:#fff;border-color:#fff" data-share>Paylaş</button></div></div></div>`;
  $('#layer').appendChild(w);
  $('[data-x]',w).onclick=()=>w.remove();$('[data-share]',w).onclick=()=>copy(`${f.name} ile ${from} → ${to}. ${pair}`);
}

function groupEditor(id,after){
  const g=id?groups().find(x=>x.id===id):{id:'g'+Date.now().toString(36),name:'',members:[]};const sel=new Set(g.members);
  const s=sheet(`<div class="row"><h2 class="h2">${id?'Grubu düzenle':'Yeni grup'}</h2><button class="mono-s" data-close>KAPAT</button></div>
    <label class="lbl" for="gName" style="display:block;margin-top:20px">GRUP ADI</label><input id="gName" class="ginput" maxlength="40" placeholder="Örn. Ev arkadaşları" value="${esc(g.name)}">
    <p class="lbl" style="margin-top:22px">KİŞİLER</p><div class="list" id="gList">${S.friends.map(f=>`<button class="li gmem" data-mem="${f.id}" aria-pressed="${sel.has(f.id)}"><span class="avatar">${esc(f.name[0])}</span><span class="grow name" style="font-size:16px">${esc(f.name)}</span><span class="gchk" aria-hidden="true"></span></button>`).join('')}</div>
    <div style="display:flex;gap:8px;margin-top:22px"><button class="btn" id="gSave">Kaydet</button>${id?'<button class="btn ghost" id="gDel">Grubu sil</button>':''}</div>`);
  s.el.querySelectorAll('[data-mem]').forEach(b=>b.onclick=()=>{const k=b.dataset.mem;sel.has(k)?sel.delete(k):sel.add(k);b.setAttribute('aria-pressed',sel.has(k))});
  $('#gSave',s.el).onclick=()=>{const n=$('#gName',s.el).value.trim();if(!n){toast('Gruba bir ad ver');return}if(!sel.size){toast('En az bir kişi seç');return}
    const old=g.members;g.name=n;g.members=[...sel];if(!id)groups().push(g);
    const d=now(),at=pad2(d.getHours())+':'+pad2(d.getMinutes()),nm=k=>(S.friends.find(f=>f.id===k)||{}).name;
    g.members.filter(k=>!old.includes(k)).forEach(k=>roomMsgs(g.id).push({who:'Sistem',t:nm(k)+' gruba eklendi',at}));
    old.filter(k=>!g.members.includes(k)).forEach(k=>roomMsgs(g.id).push({who:'Sistem',t:nm(k)+' gruptan çıkarıldı',at}));
    save();s.close();toast(id?'Grup güncellendi':'Grup oluşturuldu');after?after():render()};
  const del=$('#gDel',s.el);if(del)del.onclick=()=>{S.groups=groups().filter(x=>x.id!==id);delete S.rooms[id];save();s.close();toast('Grup silindi');S.fsub='odalar';render()};
}
function lastMsg(id){const m=roomMsgs(id),l=m[m.length-1];return l?l.who+': '+l.t:''}
function openRoom(id){
  const G=()=>groups().find(x=>x.id===id),meta=()=>{const g=G();return g?{title:g.name,sub:(g.members.length+1)+' kişi'}:ROOM_SEED[id]};
  const draw=()=>{const R=meta();return `<div class="top" style="position:sticky;top:0"><button class="link" data-back>← Geri</button><span class="mono">${esc(R.title)}</span>${G()?`<button class="mono-s" data-gedit>DÜZENLE</button>`:`<span class="mono-s mute">${esc(R.sub)}</span>`}</div>${G()?`<div class="gmembers mono-s mute">SEN · ${G().members.map(k=>esc(up((S.friends.find(f=>f.id===k)||{name:'?'}).name))).join(' · ')}</div>`:''}
    <div class="msgs">${roomMsgs(id).map(m=>m.who==='Sistem'?`<p class="sysmsg mono-s mute">${esc(up(m.t))}</p>`:`<div class="msg ${m.who==='Sen'?'me':''}"><span class="avatar">${esc(m.who[0])}</span><div><div class="meta"><span>${esc(m.who)}</span><span>${esc(m.at)}</span>${m.who!=='Sen'?`<button class="link" style="font-size:9px" data-report>Bildir</button>`:''}</div><div class="txt">${esc(m.t)}</div></div></div>`).join('')}</div>
    <div class="composer"><form id="roomForm"><textarea id="roomIn" rows="1" placeholder="Mesaj yaz" aria-label="Mesaj"></textarea><button class="btn small" type="submit">Gönder</button></form></div>`};
  main.innerHTML='';const w=document.createElement('div');w.innerHTML=draw();main.appendChild(w);
  const bind=()=>{$('[data-back]',w).onclick=()=>render();{const e=$('[data-gedit]',w);if(e)e.onclick=()=>groupEditor(id,()=>{if(G()){w.innerHTML=draw();bind();toBottom()}else render()})}w.querySelectorAll('[data-report]').forEach(b=>b.onclick=()=>toast('Mesaj bildirildi'));
    $('#roomForm',w).onsubmit=e=>{e.preventDefault();const v=$('#roomIn',w).value.trim();if(!v)return;const d=now();roomMsgs(id).push({who:'Sen',t:v.slice(0,500),at:pad2(d.getHours())+':'+pad2(d.getMinutes())});save();w.innerHTML=draw();bind();toBottom()}};
  bind();toBottom();
}

function vVoid(){
  const left=LIMIT-used();const cat=S.vcat||'Ben';
  const out=[`<div class="vhead"><span></span><span class="t">VOID’E HOŞ GELDİN</span><span class="vcount" title="Kalan soru">${left}</span></div>`];
  if(!S.chat.length){
    out.push(`<div class="vcats">${Object.keys(VCATS).map(k=>`<button data-vcat="${k}" aria-pressed="${k===cat}"><span class="vimg vimg-${k==='İş'?'is':k==='Aşk'?'ask':low(k)}"><img src="${VIMG[k]}" alt=""></span>${up(k)}</button>`).join('')}</div>`);
    out.push(`<div class="vqs">${VCATS[cat].q.map(q=>`<button data-q="${esc(q)}">${esc(q)}</button>`).join('')}</div>`);
  }
  const log=el(`<div class="vlog" aria-live="polite"></div>`);S.chat.forEach(m=>log.appendChild(vbubble(m)));out.push(log);
  out.push(`<div class="vcomp"><form id="askForm"><textarea id="askIn" rows="1" placeholder="${left>0?'Bir şey sor...':'Yeni sorular 00:00’da'}" ${left>0?'':'disabled'} aria-label="Soru"></textarea><button class="ask" type="submit" id="askBtn" ${left>0?'':'disabled'}>SOR</button></form>
    <div class="meta"><span>${left} SORU · 00:00’DA YENİLENİR</span>${S.chat.length?'<button id="newChat">Yeni sohbet</button>':''}</div></div>`);
  const f=frag(out,'void');
  f.querySelectorAll('[data-vcat]').forEach(b=>b.onclick=()=>{S.vcat=b.dataset.vcat;save();render()});
  f.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{$('#askIn').value=b.dataset.q;ask()});
  $('#askForm',f).onsubmit=e=>{e.preventDefault();ask()};
  const ta=$('#askIn',f);ta.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();ask()}});
  ta.addEventListener('input',()=>{ta.style.height='auto';ta.style.height=Math.min(110,ta.scrollHeight)+'px'});
  const nc=$('#newChat',f);if(nc)nc.onclick=()=>{if(ctl)ctl.abort();S.chat=[];save();render()};
  if(S.pendingQ){ta.value=S.pendingQ;delete S.pendingQ;setTimeout(()=>ta.focus(),50)}
  if(S.chat.length)setTimeout(toBottom,0);
  return f;
}
function vbubble(m){
  if(m.role==='user')return el(`<div class="vq">${esc(m.content)}</div>`);
  return el(`<div class="va ${m.err?'err':''}"><span class="who">VOID${m.demo?' · ÖRNEK YANIT':''}</span>${esc(m.content)}</div>`);
}
function context(){
  const t=S.tarot[TODAY];const card=t?`${TAROT[t.i][1]}${t.rev?' (ters)':''}: ${t.rev?TAROT[t.i][3]:TAROT[t.i][2]}`:'Bugün henüz kart çekilmedi.';
  const ks=weekKeys().filter(k=>S.moods[k]);const av=MOODS.map(([k,l])=>{const a=avgOf(ks,k);return a==null?null:`${l} ${a.toFixed(1)}`}).filter(Boolean).join(', ');
  const fr=S.friends.map(f=>`${f.name} (${f.rel}, ${BURC[f.sun]} Güneş, ${BURC[f.moon]} Ay, ${BURC[f.asc]} yükselen)`).join('; ');
  const pl=PLANETS.map(p=>`${p.k} ${BURC[Math.floor(p.lon/30)]} ${houseOf(p.lon,S.settings.house)}. ev`).join(', ');
  return `Kullanıcı: ${ME.name}, ${BURC[ME.sun]} Güneş, ${BURC[ME.moon]} Ay, ${BURC[ME.asc]} yükselen. Ev sistemi: ${S.settings.house}. Gezegenler: ${pl}.
Bugün: ${fmt(now())}, Ay ${BURC_DA[moonSign(now())]}, ay evresi ${phaseName(now())}.
Bugünün tarot kartı: ${card}
Bu haftanın duygu ortalaması (0-10): ${av||'kayıt yok'}.
İlişki durumu: ${S.settings.status}. Yaşam evresi: ${S.settings.life}. Kullanıcı 18 yaşından büyük.
Arkadaşları: ${fr}.`;
}
function rules(){
  const tone={Destekleyici:'sıcak, cesaretlendirici',Dengeli:'dengeli ve net',Sert:'kısa, doğrudan ama asla aşağılayıcı olmayan'}[S.settings.tone];
  return `Sen Sema adlı bir astroloji uygulamasının Void adlı sohbet astroloğusun. Türkçe yaz. Tonun ${tone} olsun.
Kurallar:
- Cevabını kullanıcının haritasına, bugünkü gökyüzüne, tarot kartına ve duygu kayıtlarına dayandır; hangisine dayandığını doğal biçimde söyle.
- 60-130 kelime. Düz metin, başlık ve madde işareti kullanma.
- Uzun tire kullanma. "Bu X değil, Y" kalıbını kullanma. Üçlü sıralamalardan kaçın.
- Kesin ve korkutucu kehanetler verme ("asla evlenmeyeceksin", "ayrılmalısın" gibi). Olasılık ve öneri dilini kullan.
- Sağlık, hukuk ve para konularında kesin yönlendirme yapma, uzmana yönlendir.
- Kullanıcı kendine zarar verme ya da kriz belirtisi gösterirse astrolojiyi bırak, şefkatle profesyonel destek almasını ve Türkiye'de 112'yi aramasını öner.
Bağlam:
${context()}`;
}

  busy=true;ta.value='';
  S.chat.push({role:'user',content:q.slice(0,600)});save();
  ['.vcats','.vqs'].forEach(s=>{const e=$(s);if(e)e.remove()});
  const log=$('.vlog');log.appendChild(vbubble(S.chat[S.chat.length-1]));
  const a=el(`<div class="va"><span class="who">VOID</span><span class="t">Boşluk dinliyor...</span></div>`);log.appendChild(a);toBottom();
  $('#askBtn').disabled=true;
  if(!sampleFn){await new Promise(r=>setTimeout(r,900));S.chat.push({role:'assistant',content:demoAnswer(),demo:true});S.quota[TODAY]=used()+1;save();busy=false;render();return}
  ctl=new AbortController();
  const turns=[{role:'user',content:rules()}];S.chat.filter(m=>!m.err).slice(-10).forEach(m=>turns.push({role:m.role,content:m.content}));
  try{const res=await sampleFn(turns,{cache:false,signal:ctl.signal,modelTier:'quick',onText:({text})=>{$('.t',a).textContent=text;toBottom()}});S.chat.push({role:'assistant',content:res.text});S.quota[TODAY]=used()+1}
  catch(e){const code=e&&e.code;if(code==='cancelled'){busy=false;return}
    if(['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'].includes(code)){sampleFn=null;S.chat.push({role:'assistant',content:demoAnswer(),demo:true});S.quota[TODAY]=used()+1;save();busy=false;render();return}
    let msg='Bir sorun oldu, hakkın düşmedi. Biraz sonra tekrar dene.';
    if(code==='rate_limited')msg='Çok hızlı soruldu. Biraz bekleyip tekrar dene, hakkın düşmedi.';
    if(code==='refused')msg='Bu soruyu cevaplayamıyorum, başka bir şekilde sormayı dener misin? Hakkın düşmedi.';
    S.chat.push({role:'assistant',content:msg,err:true})}
  save();busy=false;render();
}

const OS=BOT.size;
const weekId=()=>weekKeys()[0];
function weekLabel(){const m=fromKey(weekId()),e=addDays(m,6);return m.getDate()+(m.getMonth()===e.getMonth()?'':' '+AYLAR[m.getMonth()])+'–'+e.getDate()+' '+AYLAR[e.getMonth()]}
function orbsFor(keys){const o=[];let n=0;keys.forEach(k=>{const m=S.moods[k];if(!m)return;MOODS.forEach(([f])=>{const sl=BOT.slots[n%BOT.slots.length];n++;const r=rng('orb'+k+f);o.push({k,x:sl[0],y:sl[1],t:(4+r()*4).toFixed(1),d:(-r()*6).toFixed(1),dx:Math.round(r()*4-2),dy:Math.round(r()*4-2)})})});return o}
function orbHtml(o){return `<i class="orb" data-k="${o.k}" style="left:${o.x}px;top:${o.y}px;--t:${o.t}s;--d:${o.d}s;--dx:${o.dx}px;--dy:${o.dy}px"></i>`}
function bottleHtml(orbs,main){return `<div class="bottle" ${main?'id="bottle"':''}><div class="orbs">${orbs.map(orbHtml).join('')}</div><img src="${BOT.bottle}" alt=""><div class="corkclip"><img class="cork" ${main?'id="cork"':''} src="${BOT.cork}" alt=""></div>${main?`<i id="mouth" style="position:absolute;left:${BOT.mouth[0]}px;top:${BOT.mouth[1]}px;width:1px;height:1px"></i>`:''}</div>`}
function weekData(keys,label){
  const ks=keys.filter(k=>S.moods[k]);let best=MOODS[0],bv=-1;
  MOODS.forEach(m=>{if(m[0]==='kaygi')return;const a=avgOf(ks,m[0]);if(a!=null&&a>bv){bv=a;best=m}});
  const avg={};MOODS.forEach(([k])=>{const a=avgOf(ks,k);avg[k]=a==null?'-':a.toFixed(1).replace('.',',')});
  return{ks,best:best[1],bv,avg,label:label||weekLabel()};
}
function storyCard(d,big){
  return `<div class="story ${big?'big':''}"><div><div class="mono-s">SEMA · HAFTANIN ŞİŞESİ</div><div class="mono-s mute" style="margin-top:4px">${esc(up(d.label))}</div></div>
    <div class="sbottle">${bottleHtml(orbsFor(d.ks))}</div>
    <div class="serif sline">Bu haftanın duygusu: ${esc(low(d.best))}.</div>
    <div class="savg">${MOODS.map(([k,l])=>`<span><b>${d.avg[k]}</b>${l}</span>`).join('')}</div></div>`;
}
function storySheet(d){
  const s=sheet(`<div class="row"><p class="lbl" style="margin:0">STORY ÖNİZLEME</p><button class="x" data-close aria-label="Kapat">✕</button></div>
    <div style="flex:1;display:grid;place-items:center;padding:14px 0">${storyCard(d,true)}</div>
    <div style="display:flex;gap:8px;justify-content:center"><button class="btn" id="igB">Story’de paylaş</button><button class="btn ghost" id="dlB">Görseli kaydet</button></div>`,{cls:'white'});
  $('#igB',s.el).onclick=()=>toast('Gerçek uygulamada Instagram story açılır');
  $('#dlB',s.el).onclick=()=>toast('Gerçek uygulamada galeriye kaydedilir');
}
function vGunluk(){

    if(isEvening()){
      out.push(`<section class="sec mood" id="moodSec"><p class="lbl">BUGÜN · ${up(fmt(now()))}</p><h1 class="h1" style="margin-bottom:12px">Bugün nasıl hissettin?</h1>
        ${MOODS.map(([k,l])=>`<div class="m"><i class="orb" style="position:static;width:9px;height:9px"></i><label for="m_${k}">${l}</label><input type="range" id="m_${k}" min="0" max="10" step="1" value="5"><span class="v" id="v_${k}">5</span></div>`).join('')}
        <textarea id="m_note" rows="1" placeholder="Bugün ne oldu?" style="margin-top:10px"></textarea>

    out.push(`<section class="bsec">

function spray(host,ox,oy){
  const base=-90+10;

    const foam=i<26,sz=foam?7+Math.random()*12:2+Math.random()*6;
    const p=document.createElement('i');p.className='drop'+(foam?' foam':'');p.style.cssText=`left:${ox-sz/2}px;top:${oy-sz/2}px;width:${sz}px;height:${sz}px`;host.appendChild(p);
    const ang=(base+(Math.random()*46-23))*Math.PI/180,sp=(foam?120:170)+Math.random()*230,vx=Math.cos(ang)*sp,vy=Math.sin(ang)*sp,g=430,T=1.5+Math.random()*1;
    const kf=[];for(let k=0;k<=8;k++){const t=T*k/8;kf.push({transform:`translate(${(vx*t).toFixed(1)}px,${(vy*t+.5*g*t*t).toFixed(1)}px)`,opacity:k<5?1:Math.max(0,1-(k-4)/4)})}
    if(p.animate){const an=p.animate(kf,{duration:T*1000,easing:'linear',delay:Math.random()*260,fill:'both'});an.onfinish=()=>p.remove()}else setTimeout(()=>p.remove(),1500);
  }
}

function bindAyar(f){
  f.querySelectorAll('[data-seg]').forEach(b=>b.onclick=()=>{S.settings[b.dataset.seg]=b.dataset.v;save();render()});
  f.querySelectorAll('[data-tog]').forEach(b=>b.onclick=()=>{const id=b.dataset.tog;S.settings[id]=!S.settings[id];save();render()});
  f.querySelectorAll('[data-sel]').forEach(s=>s.onchange=()=>{S.settings[s.dataset.sel]=s.value;save();render()});
  const rb=$('#resetBtn',f);if(rb)rb.onclick=()=>confirmSheet('Taslak verileri sıfırlansın mı?','Kartlar, duygu kayıtların ve sohbetler örnek verilere döner.','Sıfırla',()=>{S=DEFAULTS();S.tab='sen';save();render();toast('Sıfırlandı')});
  const db=$('#delBtn',f);if(db)db.onclick=()=>confirmSheet('Hesabın silinsin mi?','Gerçek uygulamada bu işlem kalıcıdır. Taslakta sadece gösterilir.','Anladım',()=>{});
}
function avPicker(){
  const cur=(AVATARS.find(a=>a.k===S.avatar)||AVATARS[0]).k;const opt=(k,inner)=>`<button class="avopt" data-av="${k}" aria-pressed="${cur===k}" aria-label="Büst"><span class="avc">${inner}</span></button>`;
  const s=sheet(`<div class="row"><h2 class="h2">Profil fotoğrafı</h2><button class="mono-s" data-close>KAPAT</button></div><p class="body mute" style="margin:8px 0 18px">Bir büst seç. Arkadaşların seni bununla görür.</p><div class="avgrid">${AVATARS.map(a=>opt(a.k,`<img src="${a.src}" alt="">`)).join('')}</div>`);
  s.el.querySelectorAll('[data-av]').forEach(b=>b.onclick=()=>{S.avatar=b.dataset.av;save();s.close();render();toast('Profil fotoğrafı güncellendi')});
}
function confirmSheet(t,b,ok,fn){const s=sheet(`<h2 class="h2">${esc(t)}</h2><p class="body mute" style="margin-top:10px">${esc(b)}</p><div style="display:flex;gap:8px;margin-top:22px"><button class="btn" id="okB">${esc(ok)}</button><button class="btn ghost" data-close>Vazgeç</button></div>`);$('#okB',s.el).onclick=()=>{s.close();fn()}}

/* yıldızlar */
(function(){const st=$('#stars'),r=rng('stars');const mk=n=>{const sh=[];for(let i=0;i<n;i++){const x=Math.round(r()*420),y=Math.round(r()*900),a=(.3+r()*.7).toFixed(2),s=r()<.08?1:0;sh.push(`${x}px ${y}px 0 ${s}px rgba(255,255,255,${a})`)}return sh.join(',')};
  const a=document.createElement('i');a.style.boxShadow=mk(180);const b=document.createElement('i');b.className='tw';b.style.boxShadow=mk(70);st.append(a,b)})();

document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{if(b.dataset.tab==='bugun')S.sel=TODAY;go(b.dataset.tab)});
setTop();render();
const sbt=()=>{const d=now();$('#sbTime').textContent=d.getHours()+':'+pad2(d.getMinutes())};sbt();setInterval(sbt,15000);
})();
</script>
